name: Release

# This file is used for keyless signatures when publishing to Github Container Registry.
# Renaming .github/workflows/releases.yaml@refs/heads/main breaks signature verification.
# Adding `on.workflow_call` would allow other callers to get this identity. Do not do it.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: releases
  cancel-in-progress: false

jobs:
  chart-release:
    name: Operator chart
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # chart-releaser pushes index.yaml to gh-pages from a git worktree, which needs the persisted credentials
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Push charts to GHCR, sign and verify them
        run: |
          set -o pipefail
          shopt -s nullglob

          # Github Actions helper to ensure error annotations are properly escaped
          fail() {
            local msg="$*"
            msg="${msg//'%'/'%25'}"
            msg="${msg//$'\r'/'%0D'}"
            msg="${msg//$'\n'/'%0A'}"
            echo "::error::${msg}"
            exit 1
          }

          cert_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/releases.yaml@refs/heads/main"
          cert_oidc_issuer="https://token.actions.githubusercontent.com"
          oci_repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"

          pkgs=(.cr-release-packages/*.tgz)
          if (( ${#pkgs[@]} == 0 )); then
            fail "No chart packages found in .cr-release-packages/ (did chart-releaser detect any chart changes?) - nothing to push to ${oci_repo}"
          fi

          for pkg in "${pkgs[@]}"; do
            # Pushed:/Digest: lines are printed to stderr by Helm 3 and stdout by Helm 4, so we capture both
            out=$(helm push "${pkg}" "oci://${oci_repo}" 2>&1) || {
              echo "${out}"
              fail "helm push failed for ${pkg}"
            }
            echo "${out}"

            ref=$(sed -n 's/^Pushed: //p' <<< "${out}")
            digest=$(sed -n 's/^Digest: //p' <<< "${out}")

            if [[ -z "${ref}" ]]; then
              fail "helm push output for ${pkg} contains no 'Pushed:' reference"
            fi
            if [[ -z "${digest}" ]]; then
              fail "helm push output for ${pkg} contains no 'Digest:'"
            fi

            if [[ ! "${ref}" =~ ^"${oci_repo}"/[a-z0-9._-]+:[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
              fail "Unexpected 'Pushed:' reference for ${pkg}: '${ref}' (expected ${oci_repo}/<chart>:<version>)"
            fi
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              fail "Unexpected 'Digest:' for ${pkg}: '${digest}' (expected sha256:<64 hex characters>)"
            fi

            image="${ref%:*}@${digest}"

            echo "Signing ${image}"
            cosign sign --yes "${image}" || fail "cosign sign failed for ${image}"

            echo "Verifying ${image} (certificate identity ${cert_identity}, OIDC issuer ${cert_oidc_issuer})"
            cosign verify "${image}" \
              --certificate-identity "${cert_identity}" \
              --certificate-oidc-issuer "${cert_oidc_issuer}" \
              || fail "cosign verify failed for ${image} (certificate identity ${cert_identity}, OIDC issuer ${cert_oidc_issuer})"
          done

  image-release:
    name: Operator image
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Decide whether to publish
        id: plan
        run: |
          set -uo pipefail

          # Github Actions helper to ensure error annotations are properly escaped
          fail() {
            local msg="$*"
            msg="${msg//'%'/'%25'}"
            msg="${msg//$'\r'/'%0D'}"
            msg="${msg//$'\n'/'%0A'}"
            echo "::error::${msg}"
            exit 1
          }

          cert_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/releases.yaml@refs/heads/main"
          cert_oidc_issuer="https://token.actions.githubusercontent.com"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/typesense-operator"

          # We check the chart metadata -- appVersion in Chart.yaml & image.tag in values.
          # We then only publish if there has been a bump since the previous tag.

          chart=charts/typesense-operator/Chart.yaml
          values=charts/typesense-operator/values.yaml

          # https://semver.org/#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
          # references https://regex101.com/r/Ly7O1x/3/ as recommended; here we drop group naming for Bash
          semver='^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-((0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          version=$(yq -e '.appVersion' "${chart}") || fail "No appVersion in Chart.yaml"
          chart_tag=$(yq -e '.controllerManager.manager.image.tag' "${values}") || fail "No image.tag in chart values.yaml"
          [[ "${version}" =~ ${semver} && ${#version} -le 128 ]] || fail "appVersion '${version}' does not follow SemVer"
          [[ "${chart_tag}" == "${version}" ]] || fail "appVersion '${version}' in Chart.yaml differs from image.tag '${chart_tag}' in values.yaml"

          publish=true
          if previous_tag=$(git describe --tags --abbrev=0 --match 'typesense-operator-*' HEAD~ 2> /dev/null) \
              && [[ "$(git show "${previous_tag}:${chart}" | yq '.appVersion')" == "${version}" ]]; then
            echo "::notice::appVersion ${version} was already released as tag ${previous_tag}; no new image to publish"
            publish=false
          fi

          # We then check what already exists in the registry to avoid overwriting any existing images.

          if [[ "${publish}" == "true" ]] ; then
            # separate error output from the JSON
            err_log="${RUNNER_TEMP}/inspect.err"
            if existing_manifest=$(docker buildx imagetools inspect "${image}:${version}" --format '{{json .Manifest}}' 2> "${err_log}"); then
              existing_digest=$(jq -r '.digest' <<< "${existing_manifest}")
              built_for=$(jq -r '.annotations["org.opencontainers.image.version"] // empty' <<< "${existing_manifest}")

              [[ "${built_for}" == "${version}" ]] \
                || fail "${image}:${version} is already published (${existing_digest}), but it references version ${built_for}; refusing to modify it"

              cosign verify "${image}@${existing_digest}" --certificate-identity "${cert_identity}" --certificate-oidc-issuer "${cert_oidc_issuer}" > /dev/null \
                || fail "${image}:${version} is already published (${existing_digest}), but cosign could not verify it; refusing to modify it"

              echo "::notice::${image}:${version} is already published and signed (${existing_digest}); skipping re-build"
              publish=false
            elif [[ "$(< "${err_log}")" != *"${image}:${version}: not found"* ]]; then
              cat "${err_log}"
              echo "::notice::Could not look up ${image}:${version} (is this the first push?); building anyway"
            fi
          fi

          {
            echo "publish=${publish}"
            echo "image=${image}"
            echo "version=${version}"
            echo "commit=${GITHUB_SHA::7}"
            echo "build_date=$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
            echo "source_date_epoch=$(git log -1 --format=%ct)"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        if: steps.plan.outputs.publish == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Keep in sync with `make docker-buildx` scaffolding for cross-compilation.
      - name: Write Dockerfile.cross
        if: steps.plan.outputs.publish == 'true'
        run: |
          sed -e '1 s/\(^FROM\)/FROM --platform=\$\{BUILDPLATFORM\}/; t' -e ' 1,// s//FROM --platform=\$\{BUILDPLATFORM\}/' Dockerfile > Dockerfile.cross

      - name: Build and push the image by digest
        id: build
        if: steps.plan.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.plan.outputs.source_date_epoch }}
        with:
          context: .
          file: Dockerfile.cross
          # Keep in sync with PLATFORMS in Makefile (near `make docker-buildx`).
          platforms: linux/arm64,linux/amd64,linux/s390x,linux/ppc64le
          pull: true
          no-cache: true
          provenance: mode=max
          sbom: true
          build-args: |
            BIN_VERSION=${{ steps.plan.outputs.version }}
            BIN_GIT_COMMIT=${{ steps.plan.outputs.commit }}
            BIN_BUILD_DATE=${{ steps.plan.outputs.build_date }}
          labels: |
            org.opencontainers.image.title=typesense-operator
            org.opencontainers.image.description=Typesense Kubernetes Operator (TyKO)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.plan.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.title=typesense-operator
            index:org.opencontainers.image.description=Typesense Kubernetes Operator (TyKO)
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.version=${{ steps.plan.outputs.version }}
            index:org.opencontainers.image.revision=${{ github.sha }}
          # No tag yet: the version tag will be added after this digest is signed and verified
          outputs: type=image,name=${{ steps.plan.outputs.image }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true

      - name: Sign, verify and tag the image
        if: steps.plan.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          VERSION: ${{ steps.plan.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -uo pipefail

          # Github Actions helper to ensure error annotations are properly escaped
          fail() {
            local msg="$*"
            msg="${msg//'%'/'%25'}"
            msg="${msg//$'\r'/'%0D'}"
            msg="${msg//$'\n'/'%0A'}"
            echo "::error::${msg}"
            exit 1
          }

          cert_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/releases.yaml@refs/heads/main"
          cert_oidc_issuer="https://token.actions.githubusercontent.com"

          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "Unexpected image digest format: '${DIGEST}'"
          new_image_ref="${IMAGE}@${DIGEST}"

          cosign sign --yes "${new_image_ref}" \
            || fail "cosign sign failed for ${new_image_ref}"
          cosign verify "${new_image_ref}" --certificate-identity "${cert_identity}" --certificate-oidc-issuer "${cert_oidc_issuer}" \
            || fail "cosign verify failed for ${new_image_ref} (certificate identity ${cert_identity}, OIDC issuer ${cert_oidc_issuer})"

          # Sanity check that there was no upload before this job step run.
          if existing=$(docker buildx imagetools inspect --raw "${IMAGE}:${VERSION}" 2>&1 > /dev/null); then
            fail "${IMAGE}:${VERSION} already exists; refusing to move it to ${DIGEST}"
          elif [[ "${existing}" != *"${IMAGE}:${VERSION}: not found"* ]]; then
            echo "${existing}"
            fail "Could not confirm that ${IMAGE}:${VERSION} is still free"
          fi

          docker buildx imagetools create --tag "${IMAGE}:${VERSION}" "${new_image_ref}" \
            || fail "Could not tag ${new_image_ref} as ${VERSION}"
          tagged_digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r '.digest') \
            || fail "Could not read back ${IMAGE}:${VERSION}"
          [[ "${tagged_digest}" == "${DIGEST}" ]] || fail "${IMAGE}:${VERSION} resolves to '${tagged_digest}', not the signed ${DIGEST}"

          echo "Published ${IMAGE}:${VERSION} (${DIGEST})" >> "${GITHUB_STEP_SUMMARY}"
